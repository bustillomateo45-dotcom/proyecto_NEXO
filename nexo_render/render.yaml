# Blueprint de Render para Nexo.

databases:
  - name: nexo-db
    databaseName: nexo
    user: nexo
    plan: free

services:
  - type: web
    name: nexo
    runtime: python
    rootDir: nexo_render
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: nexo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: NEXO_ADMIN_USER
        value: admin
      - key: NEXO_ADMIN_PASS
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CONTACT
        value: mailto:bustillomateo45@gmail.com
