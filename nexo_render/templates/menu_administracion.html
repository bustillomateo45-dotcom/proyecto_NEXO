<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexo — Administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3F4F1;
    --surface: #FFFFFF;
    --line: #E4E6E1;
    --ink: #1C211E;
    --ink-soft: #6E756E;
    --accent: #4A3B7A;
    --accent-soft: #ECE8F4;
    --accent-2: #B5824A;
    --danger-badge: #C0392B;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ height:100%; }
  body{
    margin:0;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display:flex;
    flex-direction:column;
    height:100dvh;
    overflow:hidden;
  }

  .topbar{
    flex-shrink:0;
    display:flex; justify-content:space-between; align-items:center;
    padding: 10px 18px;
    background: var(--ink);
    color:#fff;
    font-size: 13px;
    z-index: 5;
  }
  .topbar .marca{ font-weight:700; letter-spacing:.5px; }
  .topbar .usuario{ display:flex; align-items:center; gap:10px; }
  .topbar .rol-badge{ background: var(--accent); padding:3px 10px; border-radius:999px; font-size:11px; }
  .topbar a{ color:#f3a0a0; text-decoration:none; }

  .frame{
    width:100%;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }

  .stack{
    display:flex;
    width: 200%;
    flex:1;
    min-height:0;
    transition: transform .32s cubic-bezier(.4,0,.2,1);
  }
  .frame.chat-open .stack{ transform: translateX(-50%); }

  .screen{ width: 50%; display:flex; flex-direction:column; min-height:0; }

  @media (min-width: 860px){
    .stack{ width:100%; transform:none !important; }
    .screen{ width:auto; min-height:0; }
    .screen:first-child{ width: 380px; flex-shrink:0; border-right: 1px solid var(--line); }
    .screen:last-child{ flex:1; }
    .back-btn{ display:none; }
    .salon-row.active{ background: var(--accent-soft); }
  }

  .empty-state{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    color: var(--ink-soft);
    text-align:center;
    padding: 40px;
  }
  .empty-state svg{ opacity:.5; }
  .chat-content{ display:none; flex-direction:column; flex:1; min-height:0; }
  .chat-content.visible{ display:flex; }

  .list-header{
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow-free-title{
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 12px;
  }
  .search{
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .search svg{ flex-shrink:0; }
  .search input{
    flex:1;
    border:none;
    background:none;
    outline:none;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
  }
  .search input::placeholder{ color: var(--ink-soft); }

  .no-results{
    padding: 24px 18px;
    text-align:center;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .section-label{
    padding: 14px 18px 6px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .4px;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .section-pending{
    padding: 4px 18px 14px;
    font-size: 12.5px;
    color: var(--ink-soft);
    font-style: italic;
  }

  .salon-list{ flex:1; overflow-y:auto; padding: 4px 0 12px; }

  .salon-row{
    width:100%;
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 12px 18px;
    background:none;
    border:none;
    border-bottom: 1px solid var(--line);
    text-align:left;
    cursor:pointer;
    font-family: inherit;
    color: inherit;
  }
  .salon-row:active{ background: var(--accent-soft); }

  .avatar{
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    flex-shrink:0;
  }

  .salon-main{ flex:1; min-width:0; }
  .salon-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .salon-name{ font-weight: 600; font-size: 15px; }
  .salon-time{ font-size: 12px; color: var(--ink-soft); flex-shrink:0; }
  .salon-preview{
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-top: 2px;
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }

  .badge{
    min-width: 19px;
    height: 19px;
    border-radius: 10px;
    background: var(--accent);
    color:#fff;
    font-size: 11px;
    font-weight: 700;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 0 5px;
    flex-shrink:0;
  }

  .chat-header{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 14px 14px;
    border-bottom: 1px solid var(--line);
  }
  .back-btn{
    background:none; border:none; padding:6px;
    display:flex; align-items:center; cursor:pointer;
    color: var(--ink);
  }
  .chat-header .avatar{ width:36px; height:36px; border-radius:10px; font-size:12px; }
  .chat-heading{ flex:1; min-width:0; }
  .chat-heading .name{ font-weight:600; font-size:15px; }
  .chat-heading .sub{ font-size:12px; color: var(--ink-soft); }

  .messages{
    flex:1;
    overflow-y:auto;
    padding: 16px 14px;
    display:flex;
    flex-direction:column;
    gap: 10px;
    background: var(--bg);
  }
  .bubble{
    max-width: 78%;
    padding: 9px 12px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
  }
  .bubble .sender{
    display:block;
    font-size: 11px;
    font-weight:600;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .bubble.in{
    align-self:flex-start;
    background: var(--surface);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }
  .bubble.out{
    align-self:flex-end;
    background: var(--accent);
    color:#fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.out .sender{ color: rgba(255,255,255,.75); }
  .bubble .time{
    display:block;
    font-size: 10px;
    margin-top: 4px;
    opacity:.65;
  }

  .no-messages{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--ink-soft);
    font-size: 13.5px;
    text-align:center;
    padding: 30px;
  }

  .composer{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  .composer input{
    flex:1;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 20px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    outline:none;
  }
  .composer input:focus{ border-color: var(--accent); }
  .send-btn{
    width: 38px; height:38px;
    border-radius: 50%;
    border:none;
    background: var(--accent);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .send-btn:disabled{ opacity:.4; cursor:default; }

  .pending-db{
    padding: 32px 22px;
    text-align:center;
    color: var(--ink-soft);
    font-size: 13.5px;
    line-height: 1.5;
  }
  .readonly-footer{
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    background: var(--surface);
    text-align:center;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="marca">NEXO</div>
  <div class="usuario">
    <span>{{ nombre }}</span>
    <span class="rol-badge">Administración</span>
    <a href="/administracion/gestion" style="color:#fff;font-weight:600">Gestión</a>
    <a href="/logout">Salir</a>
  </div>
</div>

<div class="frame" id="frame">
  <div class="stack">

    <!-- ============ LISTA AGRUPADA ============ -->
    <div class="screen">
      <div class="list-header">
        <h1 class="eyebrow-free-title">Mensajería</h1>
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar" autocomplete="off" />
        </div>
      </div>

      <div class="salon-list" id="salonList"><div class="pending-db">No se pudo cargar la lista de chats.<br>Revisa que el archivo <b>static/chat.js</b> esté junto a <b>app.py</b> y recarga la página.</div></div>
    </div>

    <!-- ============ CHAT ============ -->
    <div class="screen">
      <div class="empty-state" id="emptyState">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
        <span>Selecciona una conversación</span>
      </div>

      <div class="chat-content" id="chatContent">
        <div class="chat-header">
          <button class="back-btn" onclick="closeChat()" aria-label="Volver">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="avatar" id="chatAvatar"></div>
          <div class="chat-heading">
            <div class="name" id="chatName">—</div>
            <div class="sub" id="chatSub">—</div>
          </div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="readonly-footer" id="readonlyFooter" style="display:none">Este canal es solo de lectura</div>

        <div class="composer" id="composer">
          <input type="text" id="msgInput" placeholder="Escribe un mensaje..." />
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Enviar">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  window.NEXO = {{ config|tojson }};
</script>
<script src="{{ url_for('static', filename='chat.js') }}"></script>

</body>
</html>
